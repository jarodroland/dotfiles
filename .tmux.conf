# start a non-login shell
set -g default-command "${SHELL}"

# change prefix from C-b to C-a
unbind C-b 
set -g prefix C-a 

# No delay for escape key press
set -sg escape-time 0

# run updateDisplay when a client is attached
#set-hook -g client-attached 'run-shell ~/.dotfiles/updateDisplay.sh'

# color improvements (use 256 color)
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-terminal "screen-256color"

# automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g status-keys vi
setw -g mode-keys vi

setw -g monitor-activity on

set -g mouse on

# less stretching to get to the first item.
set -g base-index 1
setw -g pane-base-index 1

# open new panes in current path
bind c new-window -c '#{pane_current_path}'

bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# bind < and > to swap windows
#bind-key -r < swap-window -t -1
#bind-key -r > swap-window -t +1

# bind Ctrl-Shift-Left and Ctrl-Shift-Right to move windows Left and Right
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# set inactive/active window styles
set -g window-style 'fg=colour247,bg=default'
set -g window-active-style 'fg=colour250,bg=default'
#set -g window-style 'fg=colour247,bg=colour236'
#set -g window-active-style 'fg=colour250,bg=black'

## color / design settings
# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# panes
set -g pane-border-style 'fg=#aa0000 bg=#000000'
set -g pane-active-border-style 'bg=#000000 fg=#0000ff'

# statusbar
set -g status-position bottom
set -g status-justify centre #left
set -g status-style 'bg=#555555 fg=#ffffff'
#set -g status-style '#{?client_prefix,bg=#ff5555,bg=#555555} fg=#ffffff'
set -g status-left '#{?client_prefix,#[bg=#2222ff],#[bg=#555555]}#{session_name}:#{window_index}.#{pane_index}' # make bg blue when prefix key pressed
set -g status-right '#[fg=#ffffff,bg=#555555] #{?client_prefix,#[reverse]<Prefix>#[noreverse] ,} %Y-%d-%m %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style 'fg=#ffffff bg=#555555 bold'
setw -g window-status-current-format '[#I#[fg=#aaaaaa]:#[fg=#ffffff]#W#[fg=#aaaaaa]]'

setw -g window-status-style 'fg=#aaaaaa bg=#555555'
setw -g window-status-format ' #I:#W#{?window_flags,#F, }'

setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# messages
set -g message-style 'fg=#ffffff bg=#000000 bold'

# active window text color
set-window-option -ga window-status-activity-style bg=white

# active window background color
set-window-option -ga window-status-activity-style fg=blue

## Tmux Package Manager (tpm) setup
if-shell '[[ -f ~/.tmux/plugins/tpm/tpm ]]' {
	# list of plugins
	if-shell 
	set -g @plugin 'tmux-plugins/tpm'
	set -g @plugin 'tmux-plugins/tmux-sensible'
	set -g @plugin 'erikw/tmux-powerline'
	
	# Other examples:
	# set -g @plugin 'github_username/plugin_name'
	# set -g @plugin 'github_username/plugin_name#branch'
	# set -g @plugin 'git@github.com:user/plugin'
	# set -g @plugin 'git@bitbucket.com:user/plugin'
	
	# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
	run '~/.tmux/plugins/tpm/tpm'
}

